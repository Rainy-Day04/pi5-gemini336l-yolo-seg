gemini336l_yolo_seg:
  ros__parameters:
    color_topic: /camera/color/image_raw
    depth_topic: /camera/depth/image_raw
    camera_info_topic: /camera/color/camera_info
    mask_topic: ~/mask
    detections_topic: ~/detections_2d
    overlay_topic: ~/overlay
    overlay_compressed_topic: ~/overlay/compressed
    # Cross-machine viewer stream. Encoding only runs while it has subscribers.
    overlay_jpeg_quality: 40
    overlay_publish_hz: 5.0  # remote image and inference both remain at 5 FPS
    overlay_max_width: 640  # preserve the native 640x480 camera frame
    # Optional higher-rate preview reuses detections and costs extra CPU; off by default.
    preview_compressed_topic: ~/preview/compressed
    preview_hz: 0.0
    preview_jpeg_quality: 45
    preview_max_width: 480
    preview_max_seg_age_sec: 0.5
    objects_3d_topic: ~/objects_3d
    # With no detection/image subscribers, keep RGB-D query service alive but pause YOLO.
    run_inference_when_unsubscribed: false

    # Pi 5 starting point: raise to 384 only after checking temperature and FPS.
    inference_hz: 5.0
    imgsz: 320
    # Lower threshold reduces frame-to-frame person segmentation flicker.
    confidence_threshold: 0.20
    iou_threshold: 0.45
    max_detections: 15
    # Required for pixel-accurate masks on 640x480 letterboxed model input.
    retina_masks: true
    # COCO class IDs, comma-separated. Empty means all classes.
    classes: ""

    # RGB/depth are matched by timestamp; inference never blocks camera callbacks.
    max_depth_time_delta_sec: 0.20
    min_depth_m: 0.15
    max_depth_m: 8.0
    min_valid_depth_pixels: 20
    mask_alpha: 0.45
    # Kept false for perception-only launches until Orbbec D2C is explicitly enabled.
    depth_aligned_to_color: false
    show_distance_on_overlay: true
    # Object XYZ is transformed here before publishing and drawing navigation x/y.
    navigation_frame: base_link
    tf_lookup_timeout_sec: 0.02
